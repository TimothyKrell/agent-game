name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint -- --deny-warnings
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:api
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npx wrangler deploy --dry-run
      - name: Save build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/client
            test-results
            playwright-report
          retention-days: 7

  production:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.deploy == 'true'
      - run: npm run build
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy the production stack
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage prod --profile agent-game --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_URL: ${{ vars.PRODUCTION_URL }}
          WORKER_NAME: agent-game
          HOUSE_PROVIDER: ${{ vars.HOUSE_PROVIDER }}
          HOUSE_MODEL: ${{ vars.HOUSE_MODEL }}
          HOUSE_DAILY_BUDGET_USD: ${{ vars.HOUSE_DAILY_BUDGET_USD }}
          HOUSE_MATCH_RESERVATION_USD: ${{ vars.HOUSE_MATCH_RESERVATION_USD }}
          MAX_CONCURRENT_MATCHES: ${{ vars.MAX_CONCURRENT_MATCHES }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npx playwright install --with-deps chromium
        if: steps.current.outputs.deploy == 'true'
      - name: Verify the deployed arena
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/verify-deployment.mjs "$APP_URL"
        env:
          APP_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_OUTPUT: .agent-game/deployment-smoke.json
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent-game/deployment-smoke.json
            /tmp/opencode/agent-game-*deployed-*.png
          include-hidden-files: true
          retention-days: 30

  preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    environment:
      name: preview
      url: https://agent-game-pr-${{ github.event.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    env:
      PR_NUMBER: ${{ github.event.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PREVIEW_URL: https://agent-game-pr-${{ github.event.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is still the current open pull request
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view "$PR_NUMBER" --json state,headRefOid > /tmp/pr.json
          if jq -e --arg sha "$PR_HEAD_SHA" '.state == "OPEN" and .headRefOid == $sha' /tmp/pr.json > /dev/null; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.deploy == 'true'
      - run: npm run build
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy isolated preview resources
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage "pr-$PR_NUMBER" --profile agent-game --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      - name: Verify preview
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/verify-preview.mjs "$PREVIEW_URL"
      - name: Post preview URL
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/preview-comment.mjs deployed
        env:
          GH_TOKEN: ${{ github.token }}
