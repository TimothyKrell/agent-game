name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      extended:
        description: Run full-match, stress, visual-matrix and preview verification
        type: boolean
        default: false

permissions:
  contents: read

env:
  CI: 'true'
  WRANGLER_SEND_METRICS: 'false'

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # GitHub records this evaluated name in the attempt's job/step API before
      # PR code runs. A rerun preserves the original event SHA and base/head.
      - name: Preview identity v1 merge=${{ github.sha }} base=${{ github.event.pull_request.base.sha }} head=${{ github.event.pull_request.head.sha }}
        if: github.event_name == 'pull_request'
        run: ':'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run lint -- --deny-warnings 2>&1 | tee lint.log
        shell: bash
      - run: npm run format:check 2>&1 | tee format.log
        shell: bash
      - run: npm run typecheck 2>&1 | tee typecheck.log
        shell: bash
      - run: npm run build 2>&1 | tee build.log
        shell: bash
      - run: npx wrangler deploy --dry-run 2>&1 | tee dry-run.log
        shell: bash
      - name: Produce prebuilt preview bytes without deployment credentials
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'extended-ci') && github.event.pull_request.head.repo.full_name == github.repository
        run: node scripts/produce-preview-artifact.ts
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Publish immutable preview build
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'extended-ci') && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: .agent-game/preview-artifact
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/client
            lint.log
            format.log
            typecheck.log
            build.log
            dry-run.log
          retention-days: 7

  unit:
    name: Unit and Worker tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Exercise core inventory shard
        shell: bash
        env:
          SUCCESSION_BOUNDS_RESULTS_PATH: succession-worker-bounds-results.json
          TIM27_IDENTITY_EVIDENCE_DIR: .agent-game/ci-evidence/identity
          TIM27_BROKER_EVIDENCE_DIR: .agent-game/ci-evidence/broker
          TIM27_CLI_EVIDENCE_DIR: .agent-game/ci-evidence/cli
          GAME_FIXTURE_EVIDENCE_DIR: .agent-game/ci-evidence/game-fixtures
          TIM27_PLAYABLE_EVIDENCE_DIR: .agent-game/ci-evidence/playable
        run: |
          node -e 'const os = require("node:os"); console.log(JSON.stringify({ node: process.version, cpus: os.availableParallelism(), memoryBytes: os.totalmem(), workers: 1 }))' | tee unit.log
          npm test -- --config vitest.core.config.ts --shard=${{ matrix.shard }}/3 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json=unit-results.json 2>&1 | tee -a unit.log
      - name: Save unit and actual-host evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            unit.log
            unit-results.json
            succession-worker-bounds-results.json
            /tmp/opencode/succession-worker-small-baseline-*.json
            .agent-game/ci-evidence
            /tmp/opencode/tim27-playable-*
          include-hidden-files: true
          retention-days: 7

  extended-unit:
    name: Extended unit tests (${{ matrix.shard }}/3)
    if: inputs.extended == true || contains(github.event.pull_request.labels.*.name, 'extended-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Exercise full-match, stress and lifecycle tests
        shell: bash
        env:
          TIM27_IDENTITY_EVIDENCE_DIR: .agent-game/ci-evidence/identity
          TIM27_BROKER_EVIDENCE_DIR: .agent-game/ci-evidence/broker
          TIM27_CLI_EVIDENCE_DIR: .agent-game/ci-evidence/cli
          GAME_FIXTURE_EVIDENCE_DIR: .agent-game/ci-evidence/game-fixtures
          SUCCESSION_BOUNDS_RESULTS_PATH: .agent-game/ci-evidence/bounds.json
        run: npm test -- --config vitest.extended.config.ts --shard=${{ matrix.shard }}/3 --maxWorkers=1 --reporter=default --reporter=json --outputFile.json=extended-results.json 2>&1 | tee extended.log
      - name: Save extended failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extended-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            extended.log
            extended-results.json
            .agent-game/ci-evidence
          include-hidden-files: true
          retention-days: 7

  preview-activation:
    name: Preview activation tests
    if: inputs.extended == true || contains(github.event.pull_request.labels.*.name, 'extended-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Exercise extended preview journeys and retirement smoke
        shell: bash
        env:
          TIM27_PLAYABLE_EVIDENCE_DIR: .agent-game/ci-evidence/playable
        run: npm test -- --config vitest.preview-activation.config.ts --maxWorkers=1 --reporter=verbose --reporter=json --outputFile.json=preview-activation-results.json 2>&1 | tee preview-activation.log
      - name: Save preview activation evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: preview-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            preview-activation.log
            preview-activation-results.json
            .agent-game/ci-evidence
          include-hidden-files: true
          retention-days: 7

  api:
    name: API and recovery tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npm run test:api -- --reporter=verbose --reporter=json --outputFile.json=api-results.json 2>&1 | tee api.log
        shell: bash
      - name: Save API diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            api.log
            api-results.json
          retention-days: 7

  browser:
    name: Browser smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --config playwright.smoke.config.ts 2>&1 | tee browser.log
        shell: bash
      - name: Save browser diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            browser.log
            test-results
            playwright-report
          retention-days: 7

  browser-full:
    name: Browser and motion tests
    if: inputs.extended == true || contains(github.event.pull_request.labels.*.name, 'extended-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser 2>&1 | tee browser-full.log
        shell: bash
      - name: Save full-browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-full-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            browser-full.log
            test-results
            playwright-report
          retention-days: 7

  provider:
    name: Verify production provider transport
    if: inputs.extended == true || contains(github.event.pull_request.labels.*.name, 'extended-ci')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Exercise actual house runners against the local synthetic provider
        shell: bash
        run: npm run test:provider 2>&1 | tee provider-verification.log
      - name: Save provider verification evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: provider-verification.log
          retention-days: 7

  production:
    name: Deploy production
    needs: [verify, unit, api, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check this is still the current main commit
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [[ "$latest" == "$GITHUB_SHA" ]]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ./.github/actions/setup
        if: steps.current.outputs.deploy == 'true'
      - run: npm run build
        if: steps.current.outputs.deploy == 'true'
      - name: Deploy the production stack
        if: steps.current.outputs.deploy == 'true'
        run: bun alchemy deploy --stage prod --profile agent-game --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_URL: ${{ vars.PRODUCTION_URL }}
          WORKER_NAME: agent-game
          HOUSE_PROVIDER: ${{ vars.HOUSE_PROVIDER }}
          HOUSE_MODEL: ${{ vars.HOUSE_MODEL }}
          HOUSE_DAILY_BUDGET_USD: ${{ vars.HOUSE_DAILY_BUDGET_USD }}
          HOUSE_MATCH_RESERVATION_USD: ${{ vars.HOUSE_MATCH_RESERVATION_USD }}
          HOUSE_SUCCESSION_MATCH_RESERVATION_USD: ${{ vars.HOUSE_SUCCESSION_MATCH_RESERVATION_USD }}
          MAX_CONCURRENT_MATCHES: ${{ vars.MAX_CONCURRENT_MATCHES }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: npx playwright install --with-deps chromium
        if: steps.current.outputs.deploy == 'true'
      - name: Verify the deployed arena
        if: steps.current.outputs.deploy == 'true'
        run: node scripts/verify-deployment.mjs "$APP_URL"
        env:
          APP_URL: ${{ vars.PRODUCTION_URL }}
          SMOKE_OUTPUT: .agent-game/deployment-smoke.json
      - name: Save deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .agent-game/deployment-smoke.json
            /tmp/opencode/agent-game-*deployed-*.png
          include-hidden-files: true
          retention-days: 30
