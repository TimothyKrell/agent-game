name: Remove PR preview

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Remove preview resources
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.number }}
      cancel-in-progress: false
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PR_NUMBER: ${{ github.event.number }}
      PREVIEW_URL: https://agent-game-pr-${{ github.event.number }}.${{ vars.WORKERS_SUBDOMAIN }}.workers.dev
    steps:
      # Cleanup executes only the default branch, never the closed PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Validate the preview stage
        run: '[[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]'
      - run: npm run build
      - name: Destroy this PR's stack
        run: bun alchemy destroy --stage "pr-$PR_NUMBER" --profile agent-game --yes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
      - name: Update preview comment
        run: node scripts/preview-comment.mjs removed
        env:
          GH_TOKEN: ${{ github.token }}
