name: Remove PR preview

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr-number:
        description: Closed same-repository PR whose retained preview stage should be removed
        type: string
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  cleanup:
    name: Remove preview resources
    # Cleanup stays available while new deployment is disabled. Missing cutover
    # credentials fail visibly; manual dispatch recovers missed/old close events.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.base.ref == github.event.repository.default_branch))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.event.number || inputs.pr-number }}
      cancel-in-progress: false
      queue: max
    environment: preview
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      PR_NUMBER: ${{ github.event.number || inputs.pr-number }}
      WORKERS_SUBDOMAIN: ${{ vars.WORKERS_SUBDOMAIN }}
    steps:
      # Cleanup executes only the default branch, never the closed PR's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.21.0'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Retire source identity and destroy the closed PR's retained stack without an artifact
        run: node scripts/preview-controller.ts cleanup
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PREVIEW_DEPLOY_TOKEN: ${{ secrets.TRUSTED_PREVIEW_CLOUDFLARE_API_TOKEN }}
      - name: Update preview comment
        run: node scripts/preview-controller.ts removed
        env:
          GH_TOKEN: ${{ github.token }}
